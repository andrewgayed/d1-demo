<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D1 project</title>
    <style>
    .tile-button {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .tile-button:active {
      transform: scale(0.95);
    }

    #upgradeClicker {
      position: absolute;
      left: 120px;
      top: 120px;
    }

    #upgradeWorker1 {
      position: absolute;
      left: 120px;
      top: 220px;
    }

    body {
      background-color: #000000;
      color: white;
    }

    .upgrade-shop {
      position: absolute;
      top: 260px;
      left: 20px;
      width: 360px;
      padding: 20px;
      background-color: #151515;
      border: 2px solid #ffd700;
      border-radius: 12px;
      color: white;
      font-family: Arial, sans-serif;
    }

    .upgrade-shop h2 {
      color: #ffd700;
      margin-top: 0;
    }

    .shop-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      background-color: #292929;
      color: white;
      border: 2px solid #ffd700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }

    .shop-button:hover:not(:disabled) {
      background-color: #484025;
    }

    .shop-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .shop-button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .stats-panel {
      position: absolute;
      top: 260px;
      left: 440px;
      width: 260px;
      padding: 20px;
      background-color: #151515;
      color: white;
      border: 2px solid white;
      border-radius: 12px;
      font-family: Arial, sans-serif;
    }

    .stats-panel h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 1px solid white;
      padding-bottom: 10px;
    }

    .stats-panel div {
      white-space: pre-line;
      line-height: 2;
      font-size: 15px;
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
    <button id="mainButton" class="tile-button">
      <img src="/src/assets/tile.svg" alt="tile" width="96" height="96" />
    </button>
    <button id="upgradeClicker" class="tile-button">
      <img src="/images/upgrade1.png" alt="upgrade clicker" width="182"
        height="96" />
    </button>
    <button id="upgradeWorker1" class="tile-button">
      <img src="/images/upgrade2.png" alt="upgrade clicker" width="182"
        height="96" />
    </button>
  </body>
</html>
