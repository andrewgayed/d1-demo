<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D1 project</title>
    <style>
    .tile-button {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .tile-button:active {
      transform: scale(0.95);
    }

    #upgradeClicker {
      position: absolute;
      left: 120px;
      top: 120px;
    }

    #upgradeWorker1 {
      position: absolute;
      left: 120px;
      top: 220px;
    }

    body {
      background-color: #000000;
      color: white;
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
    <button id="mainButton" class="tile-button">
      <img src="/src/assets/tile.svg" alt="tile" width="96" height="96" />
    </button>
    <button id="upgradeClicker" class="tile-button">
      <img src="/images/upgrade1.png" alt="upgrade clicker" width="182"
        height="96" />
    </button>
    <button id="upgradeWorker1" class="tile-button">
      <img src="/images/upgrade2.png" alt="upgrade clicker" width="182"
        height="96" />
    </button>
  </body>
</html>
